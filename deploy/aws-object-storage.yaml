AWSTemplateFormatVersion: "2010-09-09"
Description: Private versioned S3 storage for the HanStone production media pipeline

Parameters:
  RuntimeUserName:
    Type: String
    Default: hanstone-production-media
    AllowedPattern: "^[A-Za-z0-9+=,.@_-]{1,64}$"
  AllowedOrigins:
    Type: CommaDelimitedList
    Default: "https://handol-edu.com,https://www.handol-edu.com"
  NoncurrentVersionRetentionDays:
    Type: Number
    Default: 90
    MinValue: 30
    MaxValue: 3650

Resources:
  MediaBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      CorsConfiguration:
        CorsRules:
          - Id: HanStoneBrowserMedia
            AllowedOrigins: !Ref AllowedOrigins
            AllowedMethods:
              - GET
              - HEAD
              - POST
            AllowedHeaders:
              - "*"
            ExposedHeaders:
              - ETag
            MaxAge: 3600
      LifecycleConfiguration:
        Rules:
          - Id: RetireNoncurrentAndIncompleteUploads
            Status: Enabled
            NoncurrentVersionExpiration:
              NoncurrentDays: !Ref NoncurrentVersionRetentionDays
              NewerNoncurrentVersions: 3
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled
      Tags:
        - Key: Application
          Value: HanStone
        - Key: Environment
          Value: production
        - Key: DataClassification
          Value: private-media

  MediaBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref MediaBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource:
              - !GetAtt MediaBucket.Arn
              - !Sub "${MediaBucket.Arn}/*"
            Condition:
              Bool:
                aws:SecureTransport: "false"

  MediaRuntimeUser:
    Type: AWS::IAM::User
    Properties:
      UserName: !Ref RuntimeUserName
      Tags:
        - Key: Application
          Value: HanStone
        - Key: Environment
          Value: production
      Policies:
        - PolicyName: HanStoneMediaBucketAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: BucketMetadata
                Effect: Allow
                Action:
                  - s3:GetBucketVersioning
                  - s3:ListBucket
                Resource: !GetAtt MediaBucket.Arn
              - Sid: ManagedObjects
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                Resource: !Sub "${MediaBucket.Arn}/*"

Outputs:
  BucketName:
    Description: Set as OBJECT_STORAGE_BUCKET
    Value: !Ref MediaBucket
  BucketRegion:
    Description: Set as OBJECT_STORAGE_REGION
    Value: !Ref AWS::Region
  RuntimeUserName:
    Description: Create one access key for this user and store it only in the server secret file
    Value: !Ref MediaRuntimeUser
