services:
  api:
    image: ${API_IMAGE:?API_IMAGE must be set}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set}
      CORS_ORIGINS: ${CORS_ORIGINS:?CORS_ORIGINS must be set}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:?PUBLIC_APP_URL must be set}
      SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME:-baduk_session}
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-168}
      OAUTH_STATE_TTL_MINUTES: ${OAUTH_STATE_TTL_MINUTES:-10}
      PASSWORD_RESET_TTL_MINUTES: ${PASSWORD_RESET_TTL_MINUTES:-30}
      EMAIL_VERIFICATION_TTL_HOURS: ${EMAIL_VERIFICATION_TTL_HOURS:-24}
      SMTP_HOST: ${SMTP_HOST:?SMTP_HOST must be set}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_REQUIRE_TLS: ${SMTP_REQUIRE_TLS:-true}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:?MAIL_FROM must be set}
      SMTP_CONNECTION_TIMEOUT_MS: ${SMTP_CONNECTION_TIMEOUT_MS:-10000}
      NAVER_CLIENT_ID: ${NAVER_CLIENT_ID:-}
      NAVER_CLIENT_SECRET: ${NAVER_CLIENT_SECRET:-}
      NAVER_REDIRECT_URI: ${NAVER_REDIRECT_URI:-}
      KAKAO_REST_API_KEY: ${KAKAO_REST_API_KEY:-}
      KAKAO_CLIENT_SECRET: ${KAKAO_CLIENT_SECRET:-}
      KAKAO_REDIRECT_URI: ${KAKAO_REDIRECT_URI:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-}
      PREFLIGHT_REQUIRED_OAUTH_PROVIDERS: ${PREFLIGHT_REQUIRED_OAUTH_PROVIDERS:-naver,kakao,google}
      GUARDIAN_INVITATION_TTL_HOURS: ${GUARDIAN_INVITATION_TTL_HOURS:-72}
      PORTONE_V1_REST_API_KEY: ${PORTONE_V1_REST_API_KEY:-}
      PORTONE_V1_REST_API_SECRET: ${PORTONE_V1_REST_API_SECRET:-}
      OBJECT_STORAGE_ENDPOINT: ${OBJECT_STORAGE_ENDPOINT:-}
      OBJECT_STORAGE_REGION: ${OBJECT_STORAGE_REGION:-ap-northeast-2}
      OBJECT_STORAGE_BUCKET: ${OBJECT_STORAGE_BUCKET:?OBJECT_STORAGE_BUCKET must be set}
      OBJECT_STORAGE_ACCESS_KEY_ID: ${OBJECT_STORAGE_ACCESS_KEY_ID:-}
      OBJECT_STORAGE_SECRET_ACCESS_KEY: ${OBJECT_STORAGE_SECRET_ACCESS_KEY:-}
      OBJECT_STORAGE_FORCE_PATH_STYLE: ${OBJECT_STORAGE_FORCE_PATH_STYLE:-false}
      PLAYBACK_CDN_PROVIDER: ${PLAYBACK_CDN_PROVIDER:-}
      PLAYBACK_CDN_BASE_URL: ${PLAYBACK_CDN_BASE_URL:-}
      PLAYBACK_CDN_KEY_PAIR_ID: ${PLAYBACK_CDN_KEY_PAIR_ID:-}
      PLAYBACK_CDN_PRIVATE_KEY_BASE64: ${PLAYBACK_CDN_PRIVATE_KEY_BASE64:-}
      PREFLIGHT_REQUIRE_CDN: ${PREFLIGHT_REQUIRE_CDN:-false}
      PLAYBACK_URL_TTL_SECONDS: ${PLAYBACK_URL_TTL_SECONDS:-300}
      VIDEO_UPLOAD_URL_TTL_SECONDS: ${VIDEO_UPLOAD_URL_TTL_SECONDS:-300}
      VIDEO_UPLOAD_MAX_BYTES: ${VIDEO_UPLOAD_MAX_BYTES:-2147483648}
      LESSON_ASSET_MAX_BYTES: ${LESSON_ASSET_MAX_BYTES:-20971520}
      MALWARE_SCANNER_HOST: ${MALWARE_SCANNER_HOST:?MALWARE_SCANNER_HOST must be set}
      MALWARE_SCANNER_PORT: ${MALWARE_SCANNER_PORT:-3310}
      MALWARE_SCANNER_TIMEOUT_MS: ${MALWARE_SCANNER_TIMEOUT_MS:-30000}
      VIDEO_SCAN_POLL_INTERVAL_MS: ${VIDEO_SCAN_POLL_INTERVAL_MS:-5000}
      VIDEO_SCAN_MAX_ATTEMPTS: ${VIDEO_SCAN_MAX_ATTEMPTS:-3}
      VIDEO_SCAN_LOCK_TIMEOUT_MS: ${VIDEO_SCAN_LOCK_TIMEOUT_MS:-7200000}
      VIDEO_CLEANUP_POLL_INTERVAL_MS: ${VIDEO_CLEANUP_POLL_INTERVAL_MS:-60000}
      VIDEO_CLEANUP_MAX_ATTEMPTS: ${VIDEO_CLEANUP_MAX_ATTEMPTS:-5}
      VIDEO_CLEANUP_LOCK_TIMEOUT_MS: ${VIDEO_CLEANUP_LOCK_TIMEOUT_MS:-600000}
      VIDEO_UPLOAD_ABANDONED_AFTER_HOURS: ${VIDEO_UPLOAD_ABANDONED_AFTER_HOURS:-24}
      VIDEO_REPLACED_RETENTION_HOURS: ${VIDEO_REPLACED_RETENTION_HOURS:-24}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/api/v1/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 10

  video-scan-worker:
    image: ${API_IMAGE:?API_IMAGE must be set}
    restart: unless-stopped
    command: ["node", "dist/video-scan-worker.js"]
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set}
      CORS_ORIGINS: ${CORS_ORIGINS:?CORS_ORIGINS must be set}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:?PUBLIC_APP_URL must be set}
      SMTP_HOST: ${SMTP_HOST:?SMTP_HOST must be set}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_REQUIRE_TLS: ${SMTP_REQUIRE_TLS:-true}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:?MAIL_FROM must be set}
      OBJECT_STORAGE_ENDPOINT: ${OBJECT_STORAGE_ENDPOINT:-}
      OBJECT_STORAGE_REGION: ${OBJECT_STORAGE_REGION:-ap-northeast-2}
      OBJECT_STORAGE_BUCKET: ${OBJECT_STORAGE_BUCKET:?OBJECT_STORAGE_BUCKET must be set}
      OBJECT_STORAGE_ACCESS_KEY_ID: ${OBJECT_STORAGE_ACCESS_KEY_ID:-}
      OBJECT_STORAGE_SECRET_ACCESS_KEY: ${OBJECT_STORAGE_SECRET_ACCESS_KEY:-}
      OBJECT_STORAGE_FORCE_PATH_STYLE: ${OBJECT_STORAGE_FORCE_PATH_STYLE:-false}
      MALWARE_SCANNER_HOST: ${MALWARE_SCANNER_HOST:?MALWARE_SCANNER_HOST must be set}
      MALWARE_SCANNER_PORT: ${MALWARE_SCANNER_PORT:-3310}
      MALWARE_SCANNER_TIMEOUT_MS: ${MALWARE_SCANNER_TIMEOUT_MS:-30000}
      VIDEO_SCAN_POLL_INTERVAL_MS: ${VIDEO_SCAN_POLL_INTERVAL_MS:-5000}
      VIDEO_SCAN_MAX_ATTEMPTS: ${VIDEO_SCAN_MAX_ATTEMPTS:-3}
      VIDEO_SCAN_LOCK_TIMEOUT_MS: ${VIDEO_SCAN_LOCK_TIMEOUT_MS:-7200000}
      VIDEO_REPLACED_RETENTION_HOURS: ${VIDEO_REPLACED_RETENTION_HOURS:-24}
      LOG_LEVEL: ${LOG_LEVEL:-info}

  video-cleanup-worker:
    image: ${API_IMAGE:?API_IMAGE must be set}
    restart: unless-stopped
    command: ["node", "dist/video-cleanup-worker.js"]
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set}
      CORS_ORIGINS: ${CORS_ORIGINS:?CORS_ORIGINS must be set}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:?PUBLIC_APP_URL must be set}
      SMTP_HOST: ${SMTP_HOST:?SMTP_HOST must be set}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_REQUIRE_TLS: ${SMTP_REQUIRE_TLS:-true}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:?MAIL_FROM must be set}
      OBJECT_STORAGE_ENDPOINT: ${OBJECT_STORAGE_ENDPOINT:-}
      OBJECT_STORAGE_REGION: ${OBJECT_STORAGE_REGION:-ap-northeast-2}
      OBJECT_STORAGE_BUCKET: ${OBJECT_STORAGE_BUCKET:?OBJECT_STORAGE_BUCKET must be set}
      OBJECT_STORAGE_ACCESS_KEY_ID: ${OBJECT_STORAGE_ACCESS_KEY_ID:-}
      OBJECT_STORAGE_SECRET_ACCESS_KEY: ${OBJECT_STORAGE_SECRET_ACCESS_KEY:-}
      OBJECT_STORAGE_FORCE_PATH_STYLE: ${OBJECT_STORAGE_FORCE_PATH_STYLE:-false}
      VIDEO_CLEANUP_POLL_INTERVAL_MS: ${VIDEO_CLEANUP_POLL_INTERVAL_MS:-60000}
      VIDEO_CLEANUP_MAX_ATTEMPTS: ${VIDEO_CLEANUP_MAX_ATTEMPTS:-5}
      VIDEO_CLEANUP_LOCK_TIMEOUT_MS: ${VIDEO_CLEANUP_LOCK_TIMEOUT_MS:-600000}
      VIDEO_UPLOAD_ABANDONED_AFTER_HOURS: ${VIDEO_UPLOAD_ABANDONED_AFTER_HOURS:-24}
      VIDEO_REPLACED_RETENTION_HOURS: ${VIDEO_REPLACED_RETENTION_HOURS:-24}
      LOG_LEVEL: ${LOG_LEVEL:-info}

  hls-transcode-worker:
    image: ${API_IMAGE:?API_IMAGE must be set}
    restart: unless-stopped
    command: ["node", "dist/hls-transcode-worker.js"]
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set}
      CORS_ORIGINS: ${CORS_ORIGINS:?CORS_ORIGINS must be set}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:?PUBLIC_APP_URL must be set}
      SMTP_HOST: ${SMTP_HOST:?SMTP_HOST must be set}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_REQUIRE_TLS: ${SMTP_REQUIRE_TLS:-true}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:?MAIL_FROM must be set}
      OBJECT_STORAGE_ENDPOINT: ${OBJECT_STORAGE_ENDPOINT:-}
      OBJECT_STORAGE_REGION: ${OBJECT_STORAGE_REGION:-ap-northeast-2}
      OBJECT_STORAGE_BUCKET: ${OBJECT_STORAGE_BUCKET:?OBJECT_STORAGE_BUCKET must be set}
      OBJECT_STORAGE_ACCESS_KEY_ID: ${OBJECT_STORAGE_ACCESS_KEY_ID:-}
      OBJECT_STORAGE_SECRET_ACCESS_KEY: ${OBJECT_STORAGE_SECRET_ACCESS_KEY:-}
      OBJECT_STORAGE_FORCE_PATH_STYLE: ${OBJECT_STORAGE_FORCE_PATH_STYLE:-false}
      HLS_TRANSCODE_POLL_INTERVAL_MS: ${HLS_TRANSCODE_POLL_INTERVAL_MS:-5000}
      HLS_TRANSCODE_MAX_ATTEMPTS: ${HLS_TRANSCODE_MAX_ATTEMPTS:-3}
      HLS_TRANSCODE_LOCK_TIMEOUT_MS: ${HLS_TRANSCODE_LOCK_TIMEOUT_MS:-14400000}
      HLS_SEGMENT_DURATION_SECONDS: ${HLS_SEGMENT_DURATION_SECONDS:-6}
      FFMPEG_PATH: ${FFMPEG_PATH:-ffmpeg}
      FFPROBE_PATH: ${FFPROBE_PATH:-ffprobe}
      VIDEO_REPLACED_RETENTION_HOURS: ${VIDEO_REPLACED_RETENTION_HOURS:-24}
      LOG_LEVEL: ${LOG_LEVEL:-info}
