# Resource overlay for the 2 GiB PHPS host. Use together with
# compose.production.yaml; do not enable the dedicated-workers profile.
services:
  api:
    environment:
      VIDEO_UPLOAD_MAX_BYTES: ${COMPACT_VIDEO_UPLOAD_MAX_BYTES:-268435456}
      MALWARE_SCANNER_TIMEOUT_MS: ${MALWARE_SCANNER_TIMEOUT_MS:-120000}
      NODE_OPTIONS: --max-old-space-size=256
    mem_limit: ${COMPACT_API_MEMORY_LIMIT:-384m}
    memswap_limit: ${COMPACT_API_MEMORY_SWAP_LIMIT:-512m}

  video-scan-worker:
    profiles: ["dedicated-workers"]

  inquiry-notification-worker:
    profiles: ["dedicated-workers"]

  account-mail-worker:
    profiles: ["dedicated-workers"]

  assignment-reminder-worker:
    profiles: ["dedicated-workers"]

  video-cleanup-worker:
    profiles: ["dedicated-workers"]

  hls-transcode-worker:
    profiles: ["dedicated-workers"]

  compact-operations-worker:
    extends:
      file: compose.production.yaml
      service: account-mail-worker
    restart: unless-stopped
    command: ["node", "dist/compact-operations-worker.js"]
    environment:
      NODE_OPTIONS: --max-old-space-size=256
      MEDIA_DELIVERY_MODE: ${MEDIA_DELIVERY_MODE:-local-download}
      LOCAL_VIDEO_ROOT: ${LOCAL_VIDEO_ROOT:-/var/lib/hanstone/media/lessons}
      LOCAL_VIDEO_MAX_BYTES: ${LOCAL_VIDEO_MAX_BYTES:-268435456}
      LOCAL_VIDEO_WARNING_FREE_BYTES: ${LOCAL_VIDEO_WARNING_FREE_BYTES:-5368709120}
      LOCAL_VIDEO_CRITICAL_FREE_BYTES: ${LOCAL_VIDEO_CRITICAL_FREE_BYTES:-1073741824}
      COMPACT_WORKER_POLL_INTERVAL_MS: ${COMPACT_WORKER_POLL_INTERVAL_MS:-5000}
      VIDEO_UPLOAD_MAX_BYTES: ${COMPACT_VIDEO_UPLOAD_MAX_BYTES:-268435456}
      MALWARE_SCANNER_TIMEOUT_MS: ${MALWARE_SCANNER_TIMEOUT_MS:-120000}
      INQUIRY_ATTACHMENT_RETENTION_HOURS: ${INQUIRY_ATTACHMENT_RETENTION_HOURS:-24}
      COMMUNITY_ATTACHMENT_RETENTION_HOURS: ${COMMUNITY_ATTACHMENT_RETENTION_HOURS:-24}
      VIDEO_CLEANUP_POLL_INTERVAL_MS: ${VIDEO_CLEANUP_POLL_INTERVAL_MS:-60000}
      VIDEO_CLEANUP_MAX_ATTEMPTS: ${VIDEO_CLEANUP_MAX_ATTEMPTS:-5}
      VIDEO_CLEANUP_LOCK_TIMEOUT_MS: ${VIDEO_CLEANUP_LOCK_TIMEOUT_MS:-600000}
      VIDEO_UPLOAD_ABANDONED_AFTER_HOURS: ${VIDEO_UPLOAD_ABANDONED_AFTER_HOURS:-24}
      HLS_TRANSCODE_POLL_INTERVAL_MS: ${HLS_TRANSCODE_POLL_INTERVAL_MS:-5000}
      HLS_TRANSCODE_MAX_ATTEMPTS: ${HLS_TRANSCODE_MAX_ATTEMPTS:-3}
      HLS_TRANSCODE_LOCK_TIMEOUT_MS: ${HLS_TRANSCODE_LOCK_TIMEOUT_MS:-14400000}
      HLS_SEGMENT_DURATION_SECONDS: ${HLS_SEGMENT_DURATION_SECONDS:-6}
      HLS_TRANSCODE_THREADS: ${HLS_TRANSCODE_THREADS:-1}
      FFMPEG_PATH: ${FFMPEG_PATH:-ffmpeg}
      FFPROBE_PATH: ${FFPROBE_PATH:-ffprobe}
      SMTP_CONNECTION_TIMEOUT_MS: ${SMTP_CONNECTION_TIMEOUT_MS:-10000}
      ACCOUNT_MAIL_ENCRYPTION_KEY_BASE64: ${ACCOUNT_MAIL_ENCRYPTION_KEY_BASE64:?ACCOUNT_MAIL_ENCRYPTION_KEY_BASE64 must be set}
      ACCOUNT_MAIL_POLL_INTERVAL_MS: ${ACCOUNT_MAIL_POLL_INTERVAL_MS:-5000}
      ACCOUNT_MAIL_MAX_ATTEMPTS: ${ACCOUNT_MAIL_MAX_ATTEMPTS:-5}
      ACCOUNT_MAIL_LOCK_TIMEOUT_MS: ${ACCOUNT_MAIL_LOCK_TIMEOUT_MS:-60000}
      INQUIRY_NOTIFICATION_POLL_INTERVAL_MS: ${INQUIRY_NOTIFICATION_POLL_INTERVAL_MS:-5000}
      INQUIRY_NOTIFICATION_MAX_ATTEMPTS: ${INQUIRY_NOTIFICATION_MAX_ATTEMPTS:-5}
      INQUIRY_NOTIFICATION_LOCK_TIMEOUT_MS: ${INQUIRY_NOTIFICATION_LOCK_TIMEOUT_MS:-60000}
    mem_limit: ${COMPACT_WORKER_MEMORY_LIMIT:-384m}
    memswap_limit: ${COMPACT_WORKER_MEMORY_SWAP_LIMIT:-512m}
    cpus: ${COMPACT_WORKER_CPU_LIMIT:-1.0}

  clamav:
    environment:
      CLAMD_STARTUP_TIMEOUT: ${CLAMD_STARTUP_TIMEOUT:-900}
      CLAMD_CONF_StreamMaxLength: ${COMPACT_CLAMAV_STREAM_MAX_LENGTH:-256M}
      CLAMD_CONF_MaxFileSize: ${COMPACT_CLAMAV_MAX_FILE_SIZE:-256M}
      CLAMD_CONF_MaxScanSize: ${COMPACT_CLAMAV_MAX_SCAN_SIZE:-300M}
      CLAMD_CONF_MaxThreads: ${COMPACT_CLAMAV_MAX_THREADS:-1}
      CLAMD_CONF_MaxQueue: ${COMPACT_CLAMAV_MAX_QUEUE:-2}
      CLAMD_CONF_ConcurrentDatabaseReload: "no"
      FRESHCLAM_CHECKS: ${COMPACT_FRESHCLAM_CHECKS:-24}
    mem_limit: ${COMPACT_CLAMAV_MEMORY_LIMIT:-1250m}
    memswap_limit: ${COMPACT_CLAMAV_MEMORY_SWAP_LIMIT:-2g}
    cpus: ${COMPACT_CLAMAV_CPU_LIMIT:-1.0}
