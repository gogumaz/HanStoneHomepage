# Install as /etc/nginx/conf.d/hanstone-cache-map.conf.
# Vite fingerprints files below /assets/, so they can be cached immutably.
# HTML, config.js, and all other entry files must be revalidated on every visit.
map $uri $hanstone_cache_control {
    default       "public, max-age=0, must-revalidate";
    ~^/assets/    "public, max-age=31536000, immutable";
    ~^/api/       "no-store";
}
