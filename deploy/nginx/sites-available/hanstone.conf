# Install only after Certbot has issued the uzdream.com certificate.
server {
    listen 80;
    listen [::]:80;
    server_name uzdream.com www.uzdream.com;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name uzdream.com www.uzdream.com;

    ssl_certificate /etc/letsencrypt/live/uzdream.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/uzdream.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    ssl_session_cache shared:hanstone_tls:5m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;

    root /var/www/hanstone/current;
    index index.html;
    server_tokens off;
    client_max_body_size 1m;

    include /etc/nginx/snippets/hanstone-security-headers.conf;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Cache-Control $hanstone_cache_control always;

    location /api/ {
        include /etc/nginx/snippets/hanstone-api-proxy.conf;
    }

    location /assets/ {
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /app.html;
    }

    location ~ /\.(?!well-known(?:/|$)) {
        deny all;
    }
}
