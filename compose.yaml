services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: baduk_history
      POSTGRES_USER: baduk
      POSTGRES_PASSWORD: baduk-local-password
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - baduk-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U baduk -d baduk_history"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./server
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgresql://baduk:baduk-local-password@database:5432/baduk_history?schema=public
      CORS_ORIGINS: http://127.0.0.1:5173,http://localhost:5173
      PUBLIC_APP_URL: http://127.0.0.1:5173
      SESSION_COOKIE_NAME: baduk_session
      SESSION_TTL_HOURS: 168
      OAUTH_STATE_TTL_MINUTES: 10
      PASSWORD_RESET_TTL_MINUTES: 30
      EMAIL_VERIFICATION_TTL_HOURS: 24
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_REQUIRE_TLS: ${SMTP_REQUIRE_TLS:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-}
      SMTP_CONNECTION_TIMEOUT_MS: ${SMTP_CONNECTION_TIMEOUT_MS:-10000}
      NAVER_CLIENT_ID: ${NAVER_CLIENT_ID:-}
      NAVER_CLIENT_SECRET: ${NAVER_CLIENT_SECRET:-}
      NAVER_REDIRECT_URI: ${NAVER_REDIRECT_URI:-}
      KAKAO_REST_API_KEY: ${KAKAO_REST_API_KEY:-}
      KAKAO_CLIENT_SECRET: ${KAKAO_CLIENT_SECRET:-}
      KAKAO_REDIRECT_URI: ${KAKAO_REDIRECT_URI:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-}
      PREFLIGHT_REQUIRED_OAUTH_PROVIDERS: ${PREFLIGHT_REQUIRED_OAUTH_PROVIDERS:-}
      GUARDIAN_INVITATION_TTL_HOURS: 72
      LOG_LEVEL: info
      MALWARE_SCANNER_HOST: ${MALWARE_SCANNER_HOST:-}
      MALWARE_SCANNER_PORT: ${MALWARE_SCANNER_PORT:-3310}
      VIDEO_SCAN_POLL_INTERVAL_MS: ${VIDEO_SCAN_POLL_INTERVAL_MS:-5000}
      VIDEO_SCAN_MAX_ATTEMPTS: ${VIDEO_SCAN_MAX_ATTEMPTS:-3}
      VIDEO_SCAN_LOCK_TIMEOUT_MS: ${VIDEO_SCAN_LOCK_TIMEOUT_MS:-7200000}
      VIDEO_CLEANUP_POLL_INTERVAL_MS: ${VIDEO_CLEANUP_POLL_INTERVAL_MS:-60000}
      VIDEO_CLEANUP_MAX_ATTEMPTS: ${VIDEO_CLEANUP_MAX_ATTEMPTS:-5}
      VIDEO_CLEANUP_LOCK_TIMEOUT_MS: ${VIDEO_CLEANUP_LOCK_TIMEOUT_MS:-600000}
      VIDEO_UPLOAD_ABANDONED_AFTER_HOURS: ${VIDEO_UPLOAD_ABANDONED_AFTER_HOURS:-24}
      VIDEO_REPLACED_RETENTION_HOURS: ${VIDEO_REPLACED_RETENTION_HOURS:-24}
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/api/v1/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 10

  video-scan-worker:
    build:
      context: ./server
    profiles: ["malware-scan"]
    command: ["node", "dist/video-scan-worker.js"]
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://baduk:baduk-local-password@database:5432/baduk_history?schema=public
      CORS_ORIGINS: http://127.0.0.1:5173,http://localhost:5173
      PUBLIC_APP_URL: http://127.0.0.1:5173
      OBJECT_STORAGE_ENDPOINT: ${OBJECT_STORAGE_ENDPOINT:-}
      OBJECT_STORAGE_REGION: ${OBJECT_STORAGE_REGION:-ap-northeast-2}
      OBJECT_STORAGE_BUCKET: ${OBJECT_STORAGE_BUCKET:-}
      OBJECT_STORAGE_ACCESS_KEY_ID: ${OBJECT_STORAGE_ACCESS_KEY_ID:-}
      OBJECT_STORAGE_SECRET_ACCESS_KEY: ${OBJECT_STORAGE_SECRET_ACCESS_KEY:-}
      OBJECT_STORAGE_FORCE_PATH_STYLE: ${OBJECT_STORAGE_FORCE_PATH_STYLE:-false}
      MALWARE_SCANNER_HOST: clamav
      MALWARE_SCANNER_PORT: 3310
      MALWARE_SCANNER_TIMEOUT_MS: ${MALWARE_SCANNER_TIMEOUT_MS:-30000}
      VIDEO_SCAN_POLL_INTERVAL_MS: ${VIDEO_SCAN_POLL_INTERVAL_MS:-5000}
      VIDEO_SCAN_MAX_ATTEMPTS: ${VIDEO_SCAN_MAX_ATTEMPTS:-3}
      VIDEO_SCAN_LOCK_TIMEOUT_MS: ${VIDEO_SCAN_LOCK_TIMEOUT_MS:-7200000}
      VIDEO_REPLACED_RETENTION_HOURS: ${VIDEO_REPLACED_RETENTION_HOURS:-24}
    depends_on:
      database:
        condition: service_healthy
      clamav:
        condition: service_started

  video-cleanup-worker:
    build:
      context: ./server
    profiles: ["malware-scan"]
    command: ["node", "dist/video-cleanup-worker.js"]
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://baduk:baduk-local-password@database:5432/baduk_history?schema=public
      CORS_ORIGINS: http://127.0.0.1:5173,http://localhost:5173
      PUBLIC_APP_URL: http://127.0.0.1:5173
      OBJECT_STORAGE_ENDPOINT: ${OBJECT_STORAGE_ENDPOINT:-}
      OBJECT_STORAGE_REGION: ${OBJECT_STORAGE_REGION:-ap-northeast-2}
      OBJECT_STORAGE_BUCKET: ${OBJECT_STORAGE_BUCKET:-}
      OBJECT_STORAGE_ACCESS_KEY_ID: ${OBJECT_STORAGE_ACCESS_KEY_ID:-}
      OBJECT_STORAGE_SECRET_ACCESS_KEY: ${OBJECT_STORAGE_SECRET_ACCESS_KEY:-}
      OBJECT_STORAGE_FORCE_PATH_STYLE: ${OBJECT_STORAGE_FORCE_PATH_STYLE:-false}
      VIDEO_CLEANUP_POLL_INTERVAL_MS: ${VIDEO_CLEANUP_POLL_INTERVAL_MS:-60000}
      VIDEO_CLEANUP_MAX_ATTEMPTS: ${VIDEO_CLEANUP_MAX_ATTEMPTS:-5}
      VIDEO_CLEANUP_LOCK_TIMEOUT_MS: ${VIDEO_CLEANUP_LOCK_TIMEOUT_MS:-600000}
      VIDEO_UPLOAD_ABANDONED_AFTER_HOURS: ${VIDEO_UPLOAD_ABANDONED_AFTER_HOURS:-24}
      VIDEO_REPLACED_RETENTION_HOURS: ${VIDEO_REPLACED_RETENTION_HOURS:-24}
    depends_on:
      database:
        condition: service_healthy

  hls-transcode-worker:
    build:
      context: ./server
    profiles: ["malware-scan"]
    command: ["node", "dist/hls-transcode-worker.js"]
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://baduk:baduk-local-password@database:5432/baduk_history?schema=public
      CORS_ORIGINS: http://127.0.0.1:5173,http://localhost:5173
      PUBLIC_APP_URL: http://127.0.0.1:5173
      OBJECT_STORAGE_ENDPOINT: ${OBJECT_STORAGE_ENDPOINT:-}
      OBJECT_STORAGE_REGION: ${OBJECT_STORAGE_REGION:-ap-northeast-2}
      OBJECT_STORAGE_BUCKET: ${OBJECT_STORAGE_BUCKET:-}
      OBJECT_STORAGE_ACCESS_KEY_ID: ${OBJECT_STORAGE_ACCESS_KEY_ID:-}
      OBJECT_STORAGE_SECRET_ACCESS_KEY: ${OBJECT_STORAGE_SECRET_ACCESS_KEY:-}
      OBJECT_STORAGE_FORCE_PATH_STYLE: ${OBJECT_STORAGE_FORCE_PATH_STYLE:-false}
      HLS_TRANSCODE_POLL_INTERVAL_MS: ${HLS_TRANSCODE_POLL_INTERVAL_MS:-5000}
      HLS_TRANSCODE_MAX_ATTEMPTS: ${HLS_TRANSCODE_MAX_ATTEMPTS:-3}
      HLS_TRANSCODE_LOCK_TIMEOUT_MS: ${HLS_TRANSCODE_LOCK_TIMEOUT_MS:-14400000}
      HLS_SEGMENT_DURATION_SECONDS: ${HLS_SEGMENT_DURATION_SECONDS:-6}
      FFMPEG_PATH: ${FFMPEG_PATH:-ffmpeg}
      FFPROBE_PATH: ${FFPROBE_PATH:-ffprobe}
      VIDEO_REPLACED_RETENTION_HOURS: ${VIDEO_REPLACED_RETENTION_HOURS:-24}
    depends_on:
      database:
        condition: service_healthy

  clamav:
    build:
      context: ./deploy/clamav
    profiles: ["malware-scan"]
    ports:
      - "127.0.0.1:3310:3310"
    volumes:
      - clamav-signatures:/var/lib/clamav

volumes:
  baduk-postgres-data:
  clamav-signatures:
